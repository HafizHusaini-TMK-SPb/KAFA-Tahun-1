<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal Latihan KAFA Tahun 1</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --hijau:#0f7a5a; --hijau2:#e6f5ef; --emas:#f2b705; --merah:#d64545; --merah2:#fdeaea;
  --teks:#1f2a2a; --kelabu:#6b7777; --latar:#f6faf8; --kad:#ffffff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--latar);color:var(--teks);
  font-family:"Nunito",system-ui,sans-serif;direction:ltr;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:16px}
header{background:linear-gradient(135deg,var(--hijau),#16a37a);color:#fff;border-radius:18px;
  padding:20px;text-align:center;box-shadow:0 6px 18px rgba(15,122,90,.25)}
header h1{margin:0;font-size:32px}
header p{margin:4px 0 0;font-size:20px;opacity:.95}
.kad{background:var(--kad);border-radius:18px;padding:20px;margin-top:16px;box-shadow:0 3px 12px rgba(0,0,0,.06)}
label{display:block;font-size:20px;font-weight:600;margin:12px 0 4px}
input,select{width:100%;font-family:inherit;font-size:20px;padding:10px 14px;border:2px solid #cfe3db;
  border-radius:12px;background:#fff}
input:focus,select:focus{outline:none;border-color:var(--hijau)}
.btn{display:inline-block;border:none;cursor:pointer;font-family:inherit;font-size:22px;font-weight:700;
  padding:10px 26px;border-radius:14px;background:var(--hijau);color:#fff;margin-top:16px}
.btn:disabled{opacity:.4;cursor:default}
.btn.kuning{background:var(--emas);color:#3a2c00}
.btn.putih{background:#fff;color:var(--hijau);border:2px solid var(--hijau)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:12px}
.unit{background:var(--hijau2);border:2px solid transparent;border-radius:16px;padding:16px;cursor:pointer;
  text-align:center;font-family:inherit;font-size:20px;font-weight:700;color:var(--hijau);transition:.15s}
.unit:hover{border-color:var(--hijau);transform:translateY(-2px)}
.unit small{display:block;font-size:17px;font-weight:400;color:var(--kelabu)}
.unit.semua{background:#fff7d9;color:#8a6500}
.atas{display:flex;justify-content:space-between;align-items:center;font-size:18px;color:var(--kelabu)}
.bar{height:10px;background:#e3eeea;border-radius:10px;overflow:hidden;margin:8px 0 4px}
.bar div{height:100%;background:var(--emas);transition:width .3s}
.soalan{font-size:26px;font-weight:700;margin:16px 0 14px;line-height:1.6}
.pilihan{display:grid;gap:12px}
.pil{font-family:inherit;font-size:22px;text-align:left;padding:12px 18px;border-radius:14px;
  border:3px solid #d6e6df;background:#fff;cursor:pointer;display:flex;align-items:center;gap:14px;transition:.12s}
.pil:hover:not(:disabled){border-color:var(--hijau);background:var(--hijau2)}
.pil .huruf{flex:0 0 44px;height:44px;border-radius:50%;background:var(--hijau2);color:var(--hijau);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:22px}
.pil.betul{border-color:var(--hijau);background:#d9f3e8}
.pil.salah{border-color:var(--merah);background:var(--merah2)}
.pil:disabled{cursor:default}
.tf{grid-template-columns:1fr 1fr}
.tf .pil{justify-content:center;font-size:26px}
.maklum{margin-top:14px;padding:12px 16px;border-radius:14px;font-size:22px;display:none}
.maklum.ok{display:block;background:#d9f3e8;color:#0b5c43}
.maklum.no{display:block;background:var(--merah2);color:#8f2424}
.tengah{text-align:center}
.skor{font-size:64px;font-weight:700;color:var(--hijau);margin:4px 0}
.bintang{font-size:46px;letter-spacing:6px}
.ralat{color:var(--merah);font-size:18px;min-height:28px}
footer{text-align:center;font-family:system-ui,sans-serif;direction:ltr;font-size:13px;color:var(--kelabu);margin:22px 0 8px}
.hide{display:none}
@media (max-width:480px){
  header h1{font-size:24px}.soalan{font-size:22px}.pil{font-size:19px}.tf .pil{font-size:22px}
}

.subjek{background:#fff;border:3px solid var(--hijau2);border-radius:18px;padding:18px 12px;cursor:pointer;
  text-align:center;font-family:inherit;font-size:22px;font-weight:700;color:var(--hijau);transition:.15s}
.subjek .ik{font-size:40px;display:block;line-height:1.3}
.subjek small{display:block;font-size:17px;font-weight:400;color:var(--kelabu)}
.subjek:hover:not(:disabled){border-color:var(--hijau);transform:translateY(-2px)}
.subjek:disabled{opacity:.45;cursor:default}
.kembali{background:none;border:none;font-family:inherit;font-size:20px;color:var(--hijau);cursor:pointer;padding:0;margin-bottom:6px}
.ar{font-family:"Noto Naskh Arabic","Scheherazade New",serif;font-size:1.25em;line-height:1.7;unicode-bidi:isolate}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Portal Latihan KAFA Tahun 1</h1>
    <p>Jabatan Pendidikan Negeri Kedah</p>
  </header>

  <section id="sPortal" class="kad">
    <div style="font-size:20px">Assalamualaikum! Pilih mata pelajaran:</div>
    <div class="grid" id="gridSubjek"></div>
  </section>

  <section id="sUnit" class="kad hide">
    <button class="kembali" onclick="tunjuk('sPortal')">◄ Kembali</button>
    <div style="font-size:22px;font-weight:700" id="tajukSubjek"></div>
    <div style="font-size:18px">Pilih unit:</div>
    <div class="grid" id="gridUnit"></div>
  </section>

  <section id="sSoalan" class="kad hide">
    <button class="kembali" onclick="tunjuk('sUnit')">◄ Kembali</button>
    <div class="atas"><span id="tajukUnit"></span><span id="bil"></span></div>
    <div class="bar"><div id="bar" style="width:0"></div></div>
    <div class="soalan" id="teksSoalan"></div>
    <div class="pilihan" id="pilihan"></div>
    <div class="maklum" id="maklum"></div>
    <div class="tengah"><button class="btn hide" id="btnNext" onclick="seterusnya()">Seterusnya ►</button></div>
  </section>

  <section id="sKeputusan" class="kad hide tengah">
    <div style="font-size:24px" id="ucapan"></div>
    <div class="bintang" id="bintang"></div>
    <div class="skor" id="skor"></div>
    <div style="font-size:20px" id="skorTeks"></div>
    <button class="btn" onclick="mulaUnit(unitSemasa)">Ulang Lagi</button>
    <button class="btn putih" onclick="tunjuk('sUnit')">Pilih Unit Lain</button>
    <button class="btn kuning" onclick="tunjuk('sPortal')">Mata Pelajaran Lain</button>
  </section>

  <footer>© 2026 Fauzan Naim bin Alias • Mentor Kajian Penandaarasan Antarabangsa, JPN Kedah</footer>
</div>

  {q:"Kira: ⭐⭐⭐⭐⭐", o:["خَمْسَةٌ","أَرْبَعَةٌ","سِتَّةٌ"], a:0},
  {q:"Kira: 🚗🚗", o:["اِثْنَانِ","وَاحِدٌ","ثَلَاثَةٌ"], a:0},
  {q:"Kira: 🐟🐟🐟🐟🐟🐟🐟🐟", o:["ثَمَانِيَةٌ","سَبْعَةٌ","تِسْعَةٌ"], a:0}
 ]}
];

/* ============ SENARAI SUBJEK ============ */
const SUBJEK = [
  {n:"Akidah",       ik:"🌙", unit:AKIDAH},
  {n:"Ibadah",       ik:"🕌", unit:IBADAH},
  {n:"Sirah",        ik:"🐪", unit:SIRAH},
  {n:"Adab",         ik:"🤲", unit:ADAB},
  {n:"Jawi",         ik:"✍️", unit:JAWI},
  {n:"Bahasa Arab",  ik:"🗣️", unit:BARAB}
];
const HURUF = ["A","B","C","D"];

let UNIT = [], unitSemasa = 0, senarai = [], idx = 0, markah = 0;
const $ = id => document.getElementById(id);

/* Teks Arab/Jawi dibungkus supaya dipapar kanan-ke-kiri dengan fon Arab */
const AR = /[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]+(?:[ \u00A0]*[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]+)*/g;
function esc(t){ return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function fmt(t){ return esc(t).replace(AR, m=>`<span class="ar" dir="rtl">${m}</span>`); }

function tunjuk(id){
  ["sPortal","sUnit","sSoalan","sKeputusan"].forEach(s=>$(s).classList.toggle("hide", s!==id));
  window.scrollTo(0,0);
}
function kocak(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
const kira = u => u.reduce((x,y)=>x+y.q.length,0);

function binaPortal(){
  const g=$("gridSubjek"); g.innerHTML="";
  SUBJEK.forEach(s=>{
    const b=document.createElement("button"); b.className="subjek";
    const ada=s.unit.length>0;
    b.innerHTML=`<span class="ik">${s.ik}</span>${s.n}<small>${ada? kira(s.unit)+" soalan" : "Akan datang"}</small>`;
    b.disabled=!ada; if(ada) b.onclick=()=>pilihSubjek(s);
    g.appendChild(b);
  });
}
function pilihSubjek(s){
  UNIT=s.unit; $("tajukSubjek").textContent=s.ik+" "+s.n;
  const g=$("gridUnit"); g.innerHTML="";
  UNIT.forEach((u,i)=>{
    const b=document.createElement("button"); b.className="unit";
    b.innerHTML=`Unit ${i+1}<small>${fmt(u.t)}</small>`; b.onclick=()=>mulaUnit(i); g.appendChild(b);
  });
  const all=document.createElement("button"); all.className="unit semua";
  all.innerHTML=`Semua Unit<small>${kira(UNIT)} soalan</small>`;
  all.onclick=()=>mulaUnit(-1); g.appendChild(all);
  tunjuk("sUnit");
}
function mulaUnit(i){
  unitSemasa=i; idx=0; markah=0;
  const src = i<0 ? UNIT.flatMap(u=>u.q) : UNIT[i].q;
  senarai = kocak(src);
  $("tajukUnit").innerHTML = i<0 ? "Semua Unit" : `Unit ${i+1}: ${fmt(UNIT[i].t)}`;
  tunjuk("sSoalan"); papar();
}
function papar(){
  const s=senarai[idx];
  $("bil").textContent=`Soalan ${idx+1} / ${senarai.length}`;
  $("bar").style.width=(idx/senarai.length*100)+"%";
  $("teksSoalan").innerHTML=fmt(s.q);
  const box=$("pilihan"); box.innerHTML=""; box.className="pilihan"+(s.tf?" tf":"");
  const ops = s.tf ? s.o.map((t,k)=>({t,k})) : kocak(s.o.map((t,k)=>({t,k})));
  ops.forEach((op,n)=>{
    const b=document.createElement("button"); b.className="pil"; b.dataset.k=op.k;
    b.innerHTML = s.tf ? esc(op.t) : `<span class="huruf">${HURUF[n]}</span><span>${fmt(op.t)}</span>`;
    b.onclick=()=>jawab(b,op.k); box.appendChild(b);
  });
  $("maklum").className="maklum"; $("maklum").textContent=""; $("btnNext").classList.add("hide");
}
function jawab(btn,k){
  const s=senarai[idx];
  document.querySelectorAll(".pil").forEach(b=>{ b.disabled=true; if(+b.dataset.k===s.a) b.classList.add("betul"); });
  const m=$("maklum");
  if(k===s.a){ markah++; m.className="maklum ok"; m.textContent="✔ Betul! Bagus."; }
  else { btn.classList.add("salah"); m.className="maklum no"; m.innerHTML="✘ Kurang tepat. Jawapan yang betul: <b>"+fmt(s.o[s.a])+"</b>"; }
  const n=$("btnNext"); n.textContent = idx===senarai.length-1 ? "Lihat Keputusan ►" : "Seterusnya ►";
  n.classList.remove("hide");
}
function seterusnya(){ idx++; if(idx<senarai.length) papar(); else tamat(); }
function tamat(){
  const j=senarai.length, p=Math.round(markah/j*100);
  $("skor").textContent=p+"%";
  $("skorTeks").textContent=`Anda menjawab ${markah} daripada ${j} soalan dengan betul.`;
  const bt = p>=80?3 : p>=50?2 : p>0?1:0;
  $("bintang").textContent="★".repeat(bt)+"☆".repeat(3-bt);
  $("ucapan").textContent = p>=80?"Tahniah! Cemerlang sekali 🌟" : p>=50?"Bagus! Teruskan berusaha 👍" : "Jangan putus asa, cuba lagi 💪";
  tunjuk("sKeputusan");
}
binaPortal();
</script>
</body>
</html>
